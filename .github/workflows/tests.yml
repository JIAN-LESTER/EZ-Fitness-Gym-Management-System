name: Tests

on:
  workflow_dispatch:
  push:
    branches: [develop, main, master, workos, staging, 'fix/**', 'bugfix/**']
  pull_request:
    branches: [develop, main, master, workos, staging]
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: read

jobs:
  test:
    name: Laravel tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: |
          echo "APP_ENV=testing" > .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env

      - name: Run tests
        run: php artisan test
