name: Linter

on:
  workflow_dispatch:
  push:
    branches: [develop, main, master, workos, staging, 'fix/**', 'bugfix/**']
  pull_request:
    branches: [develop, main, master, workos, staging]

permissions:
  contents: read

jobs:
  quality:
    name: PHP code style
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Pint
        run: composer lint:check
